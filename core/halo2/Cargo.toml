[package]
name = "oob-admission"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "OOB admission relation (admission specification, P1 full binding + W1 weak) on halo2_proofs 0.3.5 IPA/BN254"

[lib]
name = "oob_admission"
path = "src/lib.rs"

[[bin]]
name = "oob-admission"
path = "src/bin/oob-admission.rs"

[[bin]]
name = "e4-bench"
path = "src/bin/e4-bench.rs"

[dependencies]
halo2_proofs = "=0.3.5"
halo2curves = "=0.6.1"
ff = "=0.13.1"
group = "=0.13.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
rayon = "1"


[profile.release]
debug = false

[profile.test]
opt-level = 3
